<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portada 7AM</title>
<meta name="description" content="Portada 7AM: las 10 noticias más relevantes del día.">
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1b1b1b;--muted:#666;--accent:#b3261e;--line:#e3e0d8}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  header{background:var(--card);border-bottom:3px solid var(--ink);padding:1.2rem 1rem .9rem;text-align:center}
  h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.02em}
  h1 span{color:var(--accent)}
  #updated{margin:.35rem 0 0;color:var(--muted);font-size:.95rem}
  main{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 2rem}
  #grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));list-style:none;margin:0;padding:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem}
  .meta{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .medio{color:var(--accent);font-weight:700}
  .num{font-weight:700;color:var(--ink)}
  .card h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:1.2rem;line-height:1.25}
  .card p{margin:0;color:#333}
  .card a{margin-top:auto;color:var(--accent);font-weight:600;text-decoration:none}
  .card a:hover{text-decoration:underline}
  .fecha{font-size:.82rem;color:var(--muted)}
  .msg{background:#fff4f2;border:1px solid #f0c8c2;color:#7a1d16;padding:1rem;border-radius:8px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:1rem}
</style>
</head>
<body>
<header>
  <h1>Portada <span>7AM</span></h1>
  <p id="updated">Cargando…</p>
</header>
<main>
  <div id="status"></div>
  <ol id="grid" aria-live="polite"></ol>
</main>
<footer>Titulares y resúmenes basados en las fuentes enlazadas. Hora de Madrid.</footer>
<script src="app.js"></script>
</body>
</html>
