name: Assemble news.json
on:
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decompress and commit news.json
        run: |
          python3 - <<'PY'
          import base64, zlib, json, pathlib
          parts = sorted(pathlib.Path('.portada-news-parts').glob('z*.b64'))
          if parts:
              b64 = ''.join(p.read_text().strip() for p in parts)
              data = zlib.decompress(base64.b64decode(b64))
          else:
              b64 = pathlib.Path('.portada-news-parts/news.zlib.b64').read_text().strip()
              data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path('news.json').write_bytes(data)
          obj = json.loads(data)
          print('ok', len(data), obj['updatedAt'])
          PY
          git config user.name "portada-bot"
          git config user.email "portada-bot@users.noreply.github.com"
          git add news.json
          git commit -m "Portada 7AM: 2026-09-29 news.json" || echo "no change"
          git push
